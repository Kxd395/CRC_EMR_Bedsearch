<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRC SSOT EMR System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f6fa; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .header { background: #0055b3; color: white; padding: 15px; text-align: center; margin: -20px -20px 20px -20px; }
        .patient-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin: 20px 0; }
        .patient-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: #fff; cursor: pointer; transition: all 0.3s; }
        .patient-card:hover { border-color: #0055b3; box-shadow: 0 4px 8px rgba(0,85,179,0.1); }
        .patient-name { font-weight: bold; color: #0055b3; margin-bottom: 5px; }
        .patient-mrn { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .patient-status { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .status-active { background: #e8f5e8; color: #2d5016; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-placement { background: #d1ecf1; color: #0c5460; }
        .connection-status { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 CRC SSOT EMR System</h1>
            <p>Crisis Response Center - Single Source of Truth</p>
        </div>

        <div class="connection-status" id="connectionStatus">
            <h3>🔄 Loading Patient Data...</h3>
            <p>Connecting to database server at 100.112.67.23:5432</p>
        </div>

        <div class="patient-list" id="patientList">
            <!-- Patient cards will be loaded here -->
        </div>
    </div>

    <script>
        console.log('🚀 CRC SSOT EMR System Loading...');
        
        // Test patients data (fallback while database connection is fixed)
        const testPatients = [
            {
                id: 1,
                name: 'Anderson, Michael J.',
                mrn: 'MRN001234',
                status: 'Active',
                asam: '3.5',
                commitment: '302'
            },
            {
                id: 2,
                name: 'Brown, Sarah K.',
                mrn: 'MRN002345',
                status: 'Pending',
                asam: '3.7',
                commitment: '201'
            },
            {
                id: 3,
                name: 'Davis, Robert L.',
                mrn: 'MRN003456',
                status: 'Placement',
                asam: '4.0',
                commitment: 'Voluntary'
            },
            {
                id: 4,
                name: 'Wilson, Jennifer M.',
                mrn: 'MRN004567',
                status: 'Active',
                asam: '3.5',
                commitment: '302'
            },
            {
                id: 5,
                name: 'Johnson, David R.',
                mrn: 'MRN005678',
                status: 'Pending',
                asam: '3.7',
                commitment: '201'
            }
        ];

        function renderPatients(patients) {
            const patientList = document.getElementById('patientList');
            patientList.innerHTML = '';
            
            patients.forEach(patient => {
                const statusClass = patient.status.toLowerCase().replace(' ', '-');
                const card = document.createElement('div');
                card.className = 'patient-card';
                card.innerHTML = `
                    <div class="patient-name">${patient.name}</div>
                    <div class="patient-mrn">${patient.mrn}</div>
                    <div class="patient-status status-${statusClass}">${patient.status}</div>
                    <div style="margin-top: 10px; font-size: 0.9em;">
                        <span><strong>ASAM:</strong> ${patient.asam}</span> | 
                        <span><strong>Commitment:</strong> ${patient.commitment}</span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    console.log('🏥 Patient selected:', patient.name);
                    alert(`Selected patient: ${patient.name}\\nMRN: ${patient.mrn}\\nStatus: ${patient.status}`);
                });
                patientList.appendChild(card);
            });
        }

        async function loadPatientsFromAPI() {
            const statusDiv = document.getElementById('connectionStatus');
            
            try {
                statusDiv.innerHTML = '<h3>🔄 Connecting to API server...</h3><p>Attempting connection to http://localhost:3001/api/patients</p>';
                
                const response = await fetch('http://localhost:3001/api/patients');
                const data = await response.json();
                
                if (data.success && data.patients) {
                    statusDiv.innerHTML = '<h3>✅ Connected to Database!</h3><p>Successfully loaded patient data from PostgreSQL server</p>';
                    renderPatients(data.patients);
                } else {
                    throw new Error(data.message || 'Failed to load patients');
                }
            } catch (error) {
                console.error('❌ Database connection failed:', error);
                statusDiv.innerHTML = `
                    <h3>⚠️ Using Test Data</h3>
                    <p><strong>Database Connection Issue:</strong> ${error.message}</p>
                    <p><strong>Solution:</strong> Run the database fix script on server 100.112.67.23</p>
                    <p><strong>Command:</strong> <code>sudo /tmp/fix_database_connection.sh</code></p>
                `;
                renderPatients(testPatients);
            }
        }

        // Load patients when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📋 Loading patient data...');
            loadPatientsFromAPI();
        });

        console.log('✅ CRC SSOT EMR System Ready');
    </script>
</body>
</html>
