name: Deploy to Netlify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: development/prototypes/ui_prototype/package-lock.json
        
    - name: Install dependencies
      working-directory: development/prototypes/ui_prototype
      run: npm ci
      
    - name: Create production environment
      working-directory: development/prototypes/ui_prototype
      run: |
        echo "VITE_API_URL=${{ secrets.VITE_API_URL || '' }}" >> .env.production
        echo "VITE_NODE_ENV=production" >> .env.production
        echo "VITE_USE_MOCK_DATA=${{ secrets.VITE_USE_MOCK_DATA || 'true' }}" >> .env.production
        echo "VITE_ENABLE_DEBUG=false" >> .env.production
        
    - name: Build project
      working-directory: development/prototypes/ui_prototype
      run: npm run build
      
    - name: Deploy to Netlify
      uses: netlify/actions/cli@master
      with:
        args: deploy --dir=development/prototypes/ui_prototype/dist --prod
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}