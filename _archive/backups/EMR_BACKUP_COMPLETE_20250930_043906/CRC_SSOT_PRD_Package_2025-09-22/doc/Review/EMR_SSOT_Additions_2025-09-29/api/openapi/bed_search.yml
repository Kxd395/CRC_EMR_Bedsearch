openapi: 3.0.3
info:
  title: Bed Search Summary API
  version: 1.0.0
paths:
  /api/search/{id}/summary:
    get:
      summary: Server-derived summary for bed search
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  searchId: { type: string }
                  version: { type: integer }
                  status: { type: string }
                  selectedFacilityId: { type: string }
                  offers:
                    type: array
                    items:
                      type: object
                      properties:
                        facilityId: { type: string }
                        state: { type: string }
                  lastChangedAt: { type: string, format: date-time }
  /api/loc/resolve:
    get:
      summary: Resolve a LOC code to canonical mapping
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  input: { type: string }
                  canonical: { type: string }
                  aliases:
                    type: array
                    items: { type: string }
