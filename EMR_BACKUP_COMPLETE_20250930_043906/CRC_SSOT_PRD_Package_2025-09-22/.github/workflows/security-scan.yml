name: EMR Security & Compliance Scan

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]
  schedule:
    # Run daily security scan at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security & Hardcoded Value Detection
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        # Install additional security tools
        npm install -g eslint @typescript-eslint/eslint-plugin eslint-plugin-security
    
    - name: Run Hardcoded Value Scanner
      run: |
        chmod +x ./tools/security-scanner.sh
        ./tools/security-scanner.sh --ci
      continue-on-error: true
    
    - name: Run ESLint Security Rules
      run: |
        # Create temporary ESLint config for security
        cat > .eslintrc.security.json << 'EOF'
        {
          "extends": ["plugin:security/recommended"],
          "plugins": ["security"],
          "rules": {
            "security/detect-hardcoded-credentials": "error",
            "security/detect-unsafe-regex": "error",
            "security/detect-buffer-noassert": "error",
            "security/detect-child-process": "warn",
            "security/detect-disable-mustache-escape": "error",
            "security/detect-eval-with-expression": "error",
            "security/detect-new-buffer": "error",
            "security/detect-no-csrf-before-method-override": "error",
            "security/detect-non-literal-fs-filename": "warn",
            "security/detect-non-literal-regexp": "warn",
            "security/detect-non-literal-require": "warn",
            "security/detect-object-injection": "warn",
            "security/detect-possible-timing-attacks": "warn",
            "security/detect-pseudoRandomBytes": "error"
          },
          "env": {
            "node": true,
            "browser": true,
            "es6": true
          }
        }
        EOF
        
        npx eslint --config .eslintrc.security.json "**/*.{js,ts,jsx,tsx}" --format github || true
    
    - name: Check for .env files in repository
      run: |
        if find . -name ".env" -not -path "./.git/*" | head -1 | grep -q .; then
          echo "::error::Environment files found in repository! These should not be committed."
          find . -name ".env" -not -path "./.git/*" | while read file; do
            echo "::error file=$file::Environment file committed to repository"
          done
          exit 1
        else
          echo "✅ No .env files found in repository"
        fi
    
    - name: Validate .env.example
      run: |
        if [ ! -f ".env.example" ]; then
          echo "::warning::No .env.example file found. Consider creating one for deployment guidance."
        else
          # Check if .env.example contains placeholder values
          if grep -qE '(localhost|127\.0\.0\.1|password|secret)' .env.example && ! grep -qE '(your-|placeholder|example)' .env.example; then
            echo "::error::.env.example contains hardcoded values instead of placeholders"
            exit 1
          else
            echo "✅ .env.example contains proper placeholder values"
          fi
        fi
    
    - name: Check for Healthcare Data Patterns
      run: |
        # Look for potential HIPAA violations
        echo "🏥 Scanning for healthcare data patterns..."
        
        # Check for SSN patterns
        if grep -rE --include="*.js" --include="*.ts" --include="*.json" '\b[0-9]{3}-?[0-9]{2}-?[0-9]{4}\b' . | grep -v node_modules | grep -v .git; then
          echo "::error::Potential SSN patterns found in code"
          exit 1
        fi
        
        # Check for medical record numbers
        if grep -rE --include="*.js" --include="*.ts" --include="*.json" '"(mrn|medical_record_number|patient_id)"\s*:\s*"[0-9]+"' . | grep -v node_modules | grep -v .git; then
          echo "::warning::Potential hardcoded medical record numbers found"
        fi
        
        echo "✅ Healthcare data scan completed"
    
    - name: Generate Security Report
      if: always()
      run: |
        # Create comprehensive security report
        cat > security-report.md << 'EOF'
        # EMR CRC SSOT Security Scan Report
        
        **Scan Date:** $(date)
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        
        ## Scan Results
        
        ### Automated Checks Performed
        - ✅ Hardcoded value detection
        - ✅ ESLint security rules
        - ✅ Environment file validation
        - ✅ Healthcare data pattern detection
        - ✅ HIPAA compliance basic checks
        
        ### Files Scanned
        EOF
        
        find . -type f \( -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" \) | grep -v node_modules | wc -l >> security-report.md
        echo " JavaScript/TypeScript files" >> security-report.md
        
        echo "" >> security-report.md
        echo "### Next Steps" >> security-report.md
        echo "- Review any security warnings or errors above" >> security-report.md
        echo "- Ensure all sensitive data uses environment variables" >> security-report.md
        echo "- Validate HIPAA compliance for healthcare data handling" >> security-report.md
        echo "- Update .env.example with any new configuration requirements" >> security-report.md
    
    - name: Upload Security Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-report-${{ github.run_number }}
        path: |
          security-report.md
          security-scan-report.md
        retention-days: 30
    
    - name: Comment PR with Security Status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let comment = `## 🛡️ Security Scan Results\n\n`;
          
          try {
            const report = fs.readFileSync('security-scan-report.md', 'utf8');
            comment += `### Automated Security Scan\n\n`;
            comment += `✅ **Security scan completed**\n\n`;
            comment += `📄 **Full report available in workflow artifacts**\n\n`;
            comment += `### Key Checks\n`;
            comment += `- Hardcoded credentials and API keys\n`;
            comment += `- IP addresses and connection strings\n`;
            comment += `- Healthcare data patterns (HIPAA)\n`;
            comment += `- Environment configuration\n\n`;
            comment += `### Guidelines\n`;
            comment += `- All sensitive data must use environment variables\n`;
            comment += `- No real patient data in test files\n`;
            comment += `- Follow healthcare compliance requirements\n`;
            comment += `- Review NO_HARDCODED_VALUES.md for detailed policies\n`;
          } catch (error) {
            comment += `⚠️ **Security scan report not available**\n`;
            comment += `Please check workflow logs for details.\n`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Run npm audit
      run: |
        npm audit --audit-level moderate
        npm audit fix --dry-run
    
    - name: Check for known vulnerabilities
      run: |
        # Install additional security scanners
        npm install -g retire
        retire --path . --outputformat json --outputpath retire-report.json || true
        
        if [ -f retire-report.json ]; then
          echo "📋 Vulnerability report generated"
          cat retire-report.json
        fi
    
    - name: Upload Dependency Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-scan-report-${{ github.run_number }}
        path: |
          retire-report.json
        retention-days: 30