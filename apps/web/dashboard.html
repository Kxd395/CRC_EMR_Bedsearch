<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 CRC SSOT EMR - Testing Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .status-badge {
            background: #27ae60;
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: bold;
            display: inline-block;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-icon {
            font-size: 2em;
            margin-right: 15px;
        }
        
        .card-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .action-button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 8px;
            display: inline-block;
            text-decoration: none;
        }
        
        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .action-button.primary {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        
        .action-button.primary:hover {
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        
        .action-button.success {
            background: linear-gradient(135deg, #27ae60, #229954);
        }
        
        .action-button.success:hover {
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }
        
        .facilities-list {
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            padding: 15px;
        }
        
        .facility-item {
            padding: 12px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }
        
        .facility-name {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .facility-details {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 4px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c62828;
        }
        
        .success {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2e7d32;
        }
        
        .url-display {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            margin: 10px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>🏥 CRC SSOT EMR Testing Dashboard</h1>
            <div class="status-badge">Healthcare Testing Environment Active</div>
            <div class="url-display">
                <strong>Main App:</strong> <a href="http://localhost:5173" target="_blank">http://localhost:5173</a><br>
                <strong>API Server:</strong> <a href="http://localhost:3001/api/health" target="_blank">http://localhost:3001</a>
            </div>
        </div>
        
        <div class="dashboard-grid">
            <!-- Quick Access Card -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-icon">🚀</div>
                    <div class="card-title">Quick Access</div>
                </div>
                <a href="http://localhost:5173" target="_blank" class="action-button primary">
                    Open Main Application
                </a>
                <button onclick="testAPIConnection()" class="action-button">
                    Test API Connection
                </button>
                <button onclick="refreshFacilities()" class="action-button success">
                    Refresh Facilities
                </button>
            </div>
            
            <!-- Facilities List Card -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-icon">🏥</div>
                    <div class="card-title">Healthcare Facilities Directory</div>
                </div>
                <div id="facilitiesContainer">
                    <div class="loading">Loading facilities...</div>
                </div>
                <div style="margin-top: 15px;">
                    <button onclick="loadFromAPI()" class="action-button">Load from API</button>
                    <button onclick="loadFromStatic()" class="action-button">Load Static Data</button>
                </div>
            </div>
            
            <!-- Patient Search Testing -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-icon">🔍</div>
                    <div class="card-title">Patient Search Testing</div>
                </div>
                <div>
                    <button onclick="testEmergencyCommitment()" class="action-button primary">
                        Test 302 Emergency Commitment
                    </button>
                    <button onclick="testVoluntaryCommitment()" class="action-button">
                        Test 201 Voluntary Commitment
                    </button>
                    <button onclick="testExtendedCommitment()" class="action-button">
                        Test 303 Extended Commitment
                    </button>
                </div>
                <div id="searchResults" style="margin-top: 15px;"></div>
            </div>
            
            <!-- System Status -->
            <div class="dashboard-card">
                <div class="card-header">
                    <div class="card-icon">📊</div>
                    <div class="card-title">System Status</div>
                </div>
                <div id="systemStatus">
                    <div class="loading">Checking system status...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let facilitiesData = [];
        
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🏥 CRC SSOT Testing Dashboard Loaded');
            checkSystemStatus();
            loadFromAPI();
        });
        
        // Test API connection
        async function testAPIConnection() {
            try {
                const response = await fetch('http://localhost:3001/api/health');
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('API connection successful! ✅', 'success');
                } else {
                    showMessage('API connection failed: ' + data.error, 'error');
                }
            } catch (error) {
                showMessage('API connection error: ' + error.message, 'error');
            }
        }
        
        // Load facilities from API
        async function loadFromAPI() {
            const container = document.getElementById('facilitiesContainer');
            container.innerHTML = '<div class="loading">Loading from API...</div>';
            
            try {
                const response = await fetch('http://localhost:3001/api/facilities');
                
                if (!response.ok) {
                    throw new Error(`API returned ${response.status}: ${response.statusText}`);
                }
                
                const facilities = await response.json();
                facilitiesData = facilities;
                displayFacilities(facilities, 'API');
                
            } catch (error) {
                console.error('Failed to load facilities from API:', error);
                container.innerHTML = `
                    <div class="error">
                        Failed to load from API: ${error.message}
                        <br><br>
                        <button onclick="loadFromStatic()" class="action-button">Try Static Data</button>
                    </div>
                `;
            }
        }
        
        // Load static facilities data
        function loadFromStatic() {
            const staticFacilities = [
                {
                    id: 'facility_1',
                    name: 'Crisis Response Mental Health Center',
                    type: 'mental-health',
                    location: 'Philadelphia, PA',
                    capacity: 50,
                    availableBeds: 12,
                    acceptsCommitmentTypes: ['201', '302', '303'],
                    capabilities: {
                        takes302: true,
                        secureBh: true,
                        matServices: true
                    }
                },
                {
                    id: 'facility_2', 
                    name: 'Behavioral Health Treatment Center',
                    type: 'dual-diagnosis',
                    location: 'Pittsburgh, PA',
                    capacity: 30,
                    availableBeds: 8,
                    acceptsCommitmentTypes: ['201', '302'],
                    capabilities: {
                        takes302: true,
                        secureBh: false,
                        matServices: true
                    }
                },
                {
                    id: 'facility_3',
                    name: 'Substance Use Disorder Center',
                    type: 'substance-use',
                    location: 'Harrisburg, PA',
                    capacity: 25,
                    availableBeds: 5,
                    acceptsCommitmentTypes: [],
                    capabilities: {
                        takes302: false,
                        secureBh: false,
                        matServices: true
                    }
                }
            ];
            
            facilitiesData = staticFacilities;
            displayFacilities(staticFacilities, 'Static');
        }
        
        // Display facilities
        function displayFacilities(facilities, source) {
            const container = document.getElementById('facilitiesContainer');
            
            if (!facilities || facilities.length === 0) {
                container.innerHTML = '<div class="error">No facilities found</div>';
                return;
            }
            
            const html = `
                <div class="success">
                    Loaded ${facilities.length} facilities from ${source}
                </div>
                <div class="facilities-list">
                    ${facilities.map(facility => `
                        <div class="facility-item">
                            <div class="facility-name">${facility.name}</div>
                            <div class="facility-details">
                                Type: ${facility.type} | 
                                Available Beds: ${facility.availableBeds || 'N/A'} |
                                Commitment Types: ${facility.acceptsCommitmentTypes?.join(', ') || 'None'}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        // Test commitment workflows
        function testEmergencyCommitment() {
            const url = 'http://localhost:5173/?test=302&commitment=emergency&patient=test-emergency';
            window.open(url, '_blank');
            showMessage('Opened 302 Emergency Commitment test scenario', 'success');
        }
        
        function testVoluntaryCommitment() {
            const url = 'http://localhost:5173/?test=201&commitment=voluntary&patient=test-voluntary';
            window.open(url, '_blank');
            showMessage('Opened 201 Voluntary Commitment test scenario', 'success');
        }
        
        function testExtendedCommitment() {
            const url = 'http://localhost:5173/?test=303&commitment=extended&patient=test-extended';
            window.open(url, '_blank');
            showMessage('Opened 303 Extended Commitment test scenario', 'success');
        }
        
        // Check system status
        async function checkSystemStatus() {
            const statusContainer = document.getElementById('systemStatus');
            
            try {
                // Check API health
                const apiResponse = await fetch('http://localhost:3001/api/health');
                const apiHealthy = apiResponse.ok;
                
                // Check UI accessibility
                const uiResponse = await fetch('http://localhost:5173/');
                const uiHealthy = uiResponse.ok;
                
                const statusHTML = `
                    <div style="margin: 10px 0;">
                        <strong>API Server:</strong> 
                        <span style="color: ${apiHealthy ? '#27ae60' : '#e74c3c'}">
                            ${apiHealthy ? '✅ Running' : '❌ Down'}
                        </span>
                    </div>
                    <div style="margin: 10px 0;">
                        <strong>UI Server:</strong> 
                        <span style="color: ${uiHealthy ? '#27ae60' : '#e74c3c'}">
                            ${uiHealthy ? '✅ Running' : '❌ Down'}
                        </span>
                    </div>
                    <div style="margin: 10px 0;">
                        <strong>Facilities Data:</strong> 
                        <span style="color: #27ae60">
                            ✅ ${facilitiesData.length} facilities loaded
                        </span>
                    </div>
                `;
                
                statusContainer.innerHTML = statusHTML;
                
            } catch (error) {
                statusContainer.innerHTML = `
                    <div class="error">
                        System check failed: ${error.message}
                    </div>
                `;
            }
        }
        
        // Refresh facilities data
        function refreshFacilities() {
            loadFromAPI();
            setTimeout(checkSystemStatus, 1000);
        }
        
        // Show messages
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'error' ? 'error' : 'success';
            messageDiv.textContent = message;
            messageDiv.style.position = 'fixed';
            messageDiv.style.top = '20px';
            messageDiv.style.right = '20px';
            messageDiv.style.zIndex = '9999';
            messageDiv.style.minWidth = '300px';
            
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                document.body.removeChild(messageDiv);
            }, 5000);
        }
    </script>
</body>
</html>
