# ===========================================
# EMR DATABASE SCHEMA (JSONB READY)
# ===========================================

schema:
  type: "jsonb"
  version: "1.0.0"
  
  # Core Tables
  tables:
    patients:
      primary_key: "patient_id"
      search_field: "searches"          # JSONB array
      history_field: "search_history"   # JSONB array
      updated_field: "updated_at"       # Auto-updating timestamp
      clinical_fields:
        - "asam_level"
        - "level_of_care"
        - "commitment_status"
        - "admission_status"
        - "medical_acuity"
        - "mat_needs"                   # JSONB
        
    facilities:
      primary_key: "facility_id"
      search_fields:
        - "facility_name"
        - "facility_type"
        - "level_of_care"
        
    audit_log:
      primary_key: "log_id"
      retention: "hipaa_compliant"
      
  # Indexes (Performance)
  indexes:
    - "idx_patients_searches (GIN)"
    - "idx_patients_search_history (GIN)"
    - "idx_patients_updated_at"
    - "idx_patients_mrn"
    - "idx_patients_asam"

# ===========================================
# APPLICATION CONFIGURATION
# ===========================================

application:
  # API Server
  api:
    port: 3001
    host: "localhost"
    cors_enabled: true
    debug_mode: true
    
  # UI Client  
  ui:
    port: 5174
    api_url: "http://localhost:3001"
    enable_fallback: false
    
  # Features
  features:
    bed_search: true
    search_history: true
    assessment_tracking: true
    mat_tracking: true
    facility_directory: true
    transport_scheduling: true
    audit_logging: true

