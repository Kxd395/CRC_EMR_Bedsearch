# ===========================================
# TROUBLESHOOTING REFERENCE
# ===========================================

troubleshooting:
  common_issues:
    ssh_permission_denied:
      cause: "Public key not added to server"
      solution: "Add public key to ~/.ssh/authorized_keys on server"
      
    database_connection_failed:
      cause: "pg_hba.conf missing Tailscale network"
      solution: "Run database setup script to fix pg_hba.conf"
      
    fallback_data_showing:
      cause: "Database not connected"
      solution: "Check connection string and credentials"
      
    patient_names_unknown:
      cause: "Fixed in recent update"
      solution: "Should show proper names now"
      
  connection_test:
    ssh: "ssh -i ~/.ssh/emr_homelab -p 2222 kxd395@100.112.67.23"
    database: "PGPASSWORD='emr_secure_2024' psql -h 100.112.67.23 -p 5432 -U emr_admin -d emr_crc_ssot -c 'SELECT 1;'"
    
